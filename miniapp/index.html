<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UstaBot — Do‘kon</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <div class="welcome">Xush kelibsiz 👋</div>
                <h1>🏪 Mening do‘konim</h1>
            </div>

            <button class="profile-btn">👤</button>
        </header>


        <main>

            <!-- SEARCH -->

            <div class="search-box">
                <span>🔎</span>
                <input
                    type="text"
                    placeholder="Mahsulot qidirish..."
                >
            </div>


            <!-- QUICK ACTIONS -->

            <section class="section">

                <h2>Tezkor amallar</h2>

                <div class="quick-actions">

                    <button class="action-card add">
                        <span>➕</span>
                        <b>Mahsulot qo‘shish</b>
                    </button>

                    <button class="action-card">
                        <span>📦</span>
                        <b>Mahsulotlar</b>
                    </button>

                    <button class="action-card">
                        <span>🛒</span>
                        <b>Buyurtmalar</b>
                    </button>

                    <button class="action-card">
                        <span>💰</span>
                        <b>Sotuv</b>
                    </button>

                </div>

            </section>


            <!-- STATISTICS -->

            <section class="section">

                <h2>Bugungi holat</h2>

                <div class="stats">

                    <div class="stat-card">
                        <span>💰</span>
                        <small>Bugungi savdo</small>
                        <strong>0 so‘m</strong>
                    </div>

                    <div class="stat-card">
                        <span>🛒</span>
                        <small>Buyurtmalar</small>
                        <strong>0 ta</strong>
                    </div>

                </div>

            </section>


            <!-- PRODUCTS -->

            <section class="section">

                <div class="section-title">

                    <h2>Mahsulotlar</h2>

                    <button class="see-all">
                        Barchasi →
                    </button>

                </div>


                <div class="products-list" id="productsList">

                    <!-- Mahsulotlar JavaScript orqali shu yerga chiqadi -->

                </div>

            </section>

        </main>

        <!-- ADD PRODUCT MODAL -->
        <div class="modal hidden" id="addProductModal">
            <div class="modal-box">

                <div class="modal-header">
                    <h2>➕ Mahsulot qo‘shish</h2>
                    <button id="closeProductModal">✕</button>
                </div>

                <label>Mahsulot nomi</label>
                <input
                    id="productName"
                    type="text"
                    placeholder="Masalan: PPR truba 25"
                >

                <label>Kategoriya</label>
                <select id="productCategory">
                    <option value="">Kategoriyani tanlang</option>
                    <option>Truba</option>
                    <option>Fitting</option>
                    <option>Krannik</option>
                    <option>Nasos</option>
                    <option>Jihoz</option>
                    <option>Boshqa</option>
                </select>

                <label>Narxi</label>
                <input
                    id="productPrice"
                    type="number"
                    placeholder="Masalan: 18000"
                >

                <label>O‘lchov birligi</label>
                <select id="productUnit">
                    <option value="dona">Dona</option>
                    <option value="metr">Metr</option>
                    <option value="kg">Kg</option>
                    <option value="litr">Litr</option>
                    <option value="komplekt">Komplekt</option>
                </select>

                <label>Mavjud miqdor</label>
                <input
                    id="productQuantity"
                    type="number"
                    placeholder="Masalan: 120"
                >

                <label>Mahsulot rasmi</label>
                <input
                    id="productImage"
                    type="file"
                    accept="image/*"
                >

                <button class="primary-btn save-product-btn" id="saveProduct">
                    💾 Mahsulotni saqlash
                </button>

            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">

            <button class="active">
                🏠
                <span>Bosh sahifa</span>
            </button>

            <button>
                📦
                <span>Mahsulotlar</span>
            </button>

            <button>
                🛒
                <span>Buyurtmalar</span>
            </button>

            <button>
                📊
                <span>Hisobot</span>
            </button>

            <button>
                ⚙️
                <span>Sozlamalar</span>
            </button>

        </nav>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
